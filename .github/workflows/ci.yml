name: Windows CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install uv==0.11.15
      - run: uv sync --locked --dev --python '${{ matrix.python-version }}'
      - run: uv run --no-sync pytest tests -q
      - run: uv run --no-sync ruff check src tests
      - run: uv run --no-sync python scripts/audit_release.py
      - run: uv build
