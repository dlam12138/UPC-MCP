[project]
name = "upc-mcp"
version = "0.1.0"
description = "Local, account-bound UPC campus services and settings"
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
keywords = ["mcp", "upc", "campus", "cas", "student"]
dependencies = [
  "mcp==2.3.0",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "cryptography>=44,<51",
  "websockets>=15,<17",
  "pywin32>=311; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/dlam12138/UPC-MCP"
Repository = "https://github.com/dlam12138/UPC-MCP"
Issues = "https://github.com/dlam12138/UPC-MCP/issues"

[project.scripts]
upc-mcp = "upc_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/upc_mcp"]

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tests", "/scripts", "/examples/mcp-config.example.json",
  "/docs/assets", "/docs/CONFIGURATION.md", "/docs/AGENT_SETUP.md",
  "/docs/FEATURES.md", "/docs/PRIVACY.md", "/docs/ARCHITECTURE.md",
  "/README.md", "/CHANGELOG.md", "/LICENSE", "/THIRD_PARTY_NOTICES.md",
  "/pyproject.toml", "/uv.lock", "/打开本地设置.cmd", "/安装.cmd",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
